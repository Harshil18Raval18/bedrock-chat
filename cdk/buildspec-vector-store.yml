version: 0.2

phases:
  pre_build:
    commands:
      - echo "Installing dependencies for vector store..."
      - cd backend
      - pip install -r app/vector_store/requirements.txt
      - pip install psycopg2-binary PyPDF2 boto3

  build:
    commands:
      - echo "Building vector store Lambda package..."
      - mkdir -p build/lambda
      - cp -r app build/lambda/
      - cp lambda_function.py build/lambda/
      - cd build/lambda
      - pip install -r ../../app/vector_store/requirements.txt -t .
      - zip -r ../vector-store-lambda.zip .
      - cd ../..

  post_build:
    commands:
      - echo "Vector store Lambda package built successfully"
      - echo "Initializing RDS vector store schema..."
      - python -c "from app.vector_store.schema import init_vector_store_schema; init_vector_store_schema()"

artifacts:
  files:
    - build/lambda/vector-store-lambda.zip
  name: VectorStoreLambdaArtifact

cache:
  paths:
    - '/root/.cache/pip/**/*'
